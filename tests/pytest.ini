[pytest]
testpaths = suites
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Every test carries one or more of these markers. They are the six test
# levels described in Phase 5, and they let any single level be run alone:
#
#   pytest -m security
#   pytest -m "ui or regression"
#
markers =
    ui: interface rendering, layout and accessibility
    functional: business rules and validation
    integration: data actually reaching and leaving MySQL
    e2e: complete user journeys across several pages
    regression: guards against previously fixed defects
    security: input handling, CSRF, escaping, disclosure
    logic: pure calculation, no browser needed

addopts =
    --strict-markers
    --tb=short
    -ra
    --html=reports/report.html
    --self-contained-html
    --junit-xml=reports/results.xml

# Playwright defaults. Override on the command line, e.g.
#   pytest --headed --slowmo 400
#
# --browser chromium is the default; add --browser firefox to widen coverage.
